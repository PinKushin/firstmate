name: Windows compatibility survey

# Diagnostic survey: runs every tests/*.test.sh under Git Bash on a GitHub-hosted
# windows-latest runner and summarizes which fail and the first failing line, so
# Windows-compat work targets measured breakage rather than guesses. It never
# gates a merge: each shard reports and exits 0.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-survey.yml'

permissions:
  contents: read

jobs:
  survey:
    name: Survey shard ${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      # Git Bash turns `ln -s` into a file copy unless native symlinks are requested,
      # and Firstmate's link locks and symlinked homes depend on real links.
      MSYS: winsymlinks:nativestrict
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Record the environment
        run: |
          printf 'OSTYPE=%s bash %s\n' "$OSTYPE" "$BASH_VERSION"
          for t in git jq python3 python node curl sed awk grep tmux treehouse shellcheck; do
            printf '%s -> %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done

      - name: Run this shard's tests
        continue-on-error: true
        run: |
          set +e
          export TERM=dumb
          out="$RUNNER_TEMP/survey"
          mkdir -p "$out"
          : > "$out/results.txt"
          i=0
          for f in tests/*.test.sh; do
            if [ $((i % 6)) -eq ${{ matrix.shard }} ]; then
              start=$(date +%s)
              timeout 150 bash "$f" > "$out/$(basename "$f").log" 2>&1
              rc=$?
              dur=$(( $(date +%s) - start ))
              first=$(grep -m1 -E '^(not ok|error:|.*: command not found|.*No such file)' "$out/$(basename "$f").log" | cut -c1-200)
              printf '%s | rc=%s | %ss | %s\n' "$(basename "$f")" "$rc" "$dur" "$first" >> "$out/results.txt"
            fi
            i=$((i + 1))
          done
          {
            echo "## Shard ${{ matrix.shard }}"
            echo
            echo "passed: $(grep -c '| rc=0 |' "$out/results.txt")  failed: $(grep -vc '| rc=0 |' "$out/results.txt")"
            echo
            echo '```'
            grep -v '| rc=0 |' "$out/results.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cp "$out/results.txt" "$out/summary-shard-${{ matrix.shard }}.txt"
          # The job summary is not readable through the API, so the results also go to the log.
          echo "SURVEY_RESULTS_BEGIN shard ${{ matrix.shard }}"
          cat "$out/results.txt"
          echo "SURVEY_RESULTS_END"
          for f in $(grep -v '| rc=0 |' "$out/results.txt" | cut -d' ' -f1); do
            echo "SURVEY_TAIL_BEGIN $f"
            grep -E '^(not ok|error:|.*command not found|.*No such file|.*[Pp]ermission denied)' "$out/$f.log" | head -6 | cut -c1-220
            echo "SURVEY_TAIL_END"
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-survey-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/survey
          if-no-files-found: warn
